<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Comisiones</title>
    <link rel="stylesheet" href="ventas.css">
    <script src="ventas.js"></script>
    <script src="utilitarios.js"></script>
</head>

<body>

    <div class="contenedor">
        <h1>Calculadora de Comisiones</h1>

        <div class="campo">
            <label for="txtSueldoBase">Salario Base:</label>
            <input type="text" id="txtSueldoBase" onblur="validarInput('txtSueldoBase', 'errorSueldoBase');">
            <span id="errorSueldoBase" class="mensaje-error"></span>
        </div>

        <div class="campo">
            <label for="txtVentas">Número de ventas:</label>
            <input type="text" id="txtVentas" onblur="validarInput('txtVentas', 'errorVentas');">
            <span id="errorVentas" class="mensaje-error"></span>
        </div>

        <div class="campo">
            <label for="txtPrecio">Precio del producto:</label>
            <input type="text" id="txtPrecio" onblur="validarInput('txtPrecio', 'errorPrecio');">
            <span id="errorPrecio" class="mensaje-error"></span>
        </div>

        <button onclick="calcular()">Calcular Comisión</button>

        <div class="resultados">
            <h2>Resultados</h2>

            <p>Salario Base: <span id="spSueldoBase"></span></p>
            <p>Comisión: <span id="spComision"></span></p>
            <p>Total: <span id="spTotal"></span></p>
        </div>
    </div>

</body>

</html>
